    <style>
        :root {
            --primary-color: #d32f2f;
            --primary-dark: #b71c1c;
            --primary-light: #ff6659;
            --secondary-color: #f5f5f5;
            --accent-color: #ffab00;
            --text-dark: #333333;
            --text-light: #757575;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }
        
        body {
            background: linear-gradient(135deg, #f9f9f9 0%, #eaeaea 100%);
            font-family: 'Poppins', sans-serif;
            color: var(--text-dark);
            overflow-x: hidden;
        }
        
        .pppht {
            font-family: "Paytone One", sans-serif;
            text-transform: uppercase;
            font-size: 32px;
            letter-spacing: 1px;
            background: linear-gradient(45deg, var(--primary-color), var(--primary-light));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: none;
            position: relative;
            padding-bottom: 5px;
        }
        
        .pppht::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color), var(--primary-color));
            border-radius: 2px;
        }
        
        /* Navigation Styles */
        .navbar-default {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: none;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        
        .navbar-default:hover {
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }
        
        .navbar-header {
            padding: 10px 0;
        }
        
        .navbar-toggle {
            border: none;
            background: transparent !important;
        }
        
        .navbar-toggle:hover {
            background: var(--secondary-color) !important;
        }
        
        .navbar-toggle .icon-bar {
            background: var(--primary-color);
            width: 22px;
            height: 3px;
            transition: var(--transition);
        }
        
        .navbar-toggle:hover .icon-bar {
            background: var(--primary-dark);
        }
        
        /* Top Navigation Links */
        .nav.navbar-top-links.navbar-right li a {
            color: var(--text-dark);
            font-weight: 500;
            transition: var(--transition);
            padding: 15px 10px;
        }
        
        .nav.navbar-top-links.navbar-right li a:hover, 
        .nav.navbar-top-links.navbar-right li a:focus {
            color: var(--primary-color);
            background: transparent;
        }
        
        .dropdown-menu {
            border: none;
            border-radius: 8px;
            box-shadow: var(--shadow);
            padding: 10px 0;
            margin-top: 5px;
        }
        
        .dropdown-menu > li > a {
            padding: 8px 20px;
            color: var(--text-dark);
            transition: var(--transition);
            font-weight: 400;
        }
        
        .dropdown-menu > li > a:hover {
            background: var(--secondary-color);
            color: var(--primary-color);
            padding-left: 25px;
        }
        
        /* Sidebar Styles */
        .sidebar {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%);
            box-shadow: 5px 0 15px rgba(0, 0, 0, 0.1);
            border: none;
        }
        
        .sidebar ul.nav {
            margin-top: 20px;
        }
        
        .sidebar ul.nav li {
            margin: 5px 15px;
            border-radius: 8px;
            overflow: hidden;
            transition: var(--transition);
        }
        
        .sidebar ul.nav li:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
        }
        
        .sidebar ul.nav li a {
            color: #ecf0f1;
            padding: 15px 20px;
            font-weight: 500;
            transition: var(--transition);
            border-radius: 8px;
        }
        
        .sidebar ul.nav li a:hover {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .sidebar ul.nav li a i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
            font-size: 18px;
        }
        
        .sidebar ul.nav li.active a {
            background: var(--primary-color);
            color: white;
            box-shadow: 0 4px 10px rgba(211, 47, 47, 0.3);
        }
        
        /* Content Area */
        #page-wrapper {
            padding: 20px 15px;
            min-height: calc(100vh - 52px);
            background: transparent;
        }
        
        
        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .navbar-header {
                float: none;
                text-align: center;
            }
            
            .pppht {
                font-size: 24px;
            }
            
            .sidebar {
                position: static;
                height: auto;
            }
            
            #page-wrapper {
                padding: 10px;
            }
        }
        
        /* Animation for page load */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .dashboard-card, .sidebar ul.nav li {
            animation: fadeIn 0.5s ease forwards;
        }
        
        .sidebar ul.nav li:nth-child(1) { animation-delay: 0.1s; }
        .sidebar ul.nav li:nth-child(2) { animation-delay: 0.2s; }
        .sidebar ul.nav li:nth-child(3) { animation-delay: 0.3s; }
        .sidebar ul.nav li:nth-child(4) { animation-delay: 0.4s; }
    </style>
</head>

    <script>
        // Add active class to current menu item
        $(document).ready(function() {
            var url = window.location;
            var element = $('ul.nav a').filter(function() {
                return this.href == url || url.href.indexOf(this.href) == 0;
            }).addClass('active').parent().addClass('active');
            
            while (element.is('li')) {
                element = element.parent().addClass('in').parent().addClass('active');
            }
            
            // Smooth animations
            $('.dashboard-card').hover(
                function() {
                    $(this).css('transform', 'translateY(-5px)');
                },
                function() {
                    $(this).css('transform', 'translateY(0)');
                }
            );
        });
    </script>
